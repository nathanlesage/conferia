<!--
THIS FILE IS INTENDED FOR DEVELOPING PURPOSES. IT IS ALMOST THE SAME FILE AS THE
DEMO, BUT IT REFERENCES THE UP-TO-DATE DISTRIBUTION FILES INSTEAD OF THE CACHED
CDN FILES.

HOW TO:

1. PLACE A TEST FILE `program.csv` IN THIS DIRECTORY.
2. MODIFY THE CONFIGURATION BELOW IF NECESSARY.
3. RUN `npm run watch`.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conferia Demo</title>
  <!-- Import Conferia.js -->
  <script defer src="dist/conferia.js"></script>
  <link rel="stylesheet" href="dist/conferia.css">

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="docs/assets/app.css">
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const conf = new Conferia({
        parent: document.body,
        src: 'resources/program.csv',
        title: 'Develop Conferia',
        intro: 'This is the development environment for Conferia.',
        eventCardPadding: 10,
        timeZone: 'Europe/Stockholm',
        timeGridSeconds: 900,
        autoReload: true,
        debug: true,
        dateParser (dateString, luxon) {
          // The program comes from Google Sheets and as such is lacking the T.
          return dateString.split(' ').join('T')
        },
        rowParser (row, header, record) {
          return record
        }
      })

      conf.awaitBoot().then(() => {
        console.log('Conferia booted successfully. Access the instantiated Conferia.js object with `conf`.')
        window.conf = conf
      })
    })
  </script>
</head>
<body>
</body>
</html>
